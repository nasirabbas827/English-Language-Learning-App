{% extends 'base.html' %}
{% block title %}{{ title }} - English Language Learning App{% endblock %}
{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col">
            <h2 class="text-primary"><i class="fas fa-book-open me-2"></i>{{ title }}</h2>
            <hr class="my-4">
        </div>
    </div>
    <div class="row">
        <div class="col">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="row g-3">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">{{ form.title.label }}</label>
                                {{ form.title }}
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">{{ form.category.label }}</label>
                                {{ form.category }}
                            </div>
                            <div class="col-md-12 mb-3">
                                <label class="form-label fw-bold">{{ form.skill_level.label }}</label>
                                {{ form.skill_level }}
                            </div>
                            <div class="col-md-12 mb-3">
                                <label class="form-label fw-bold">{{ form.description.label }}</label>
                                {{ form.description }}
                            </div>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success"><i class="fas fa-save me-2"></i>Save</button>
                            <a href="{% url 'lesson_list' %}" class="btn btn-secondary"><i class="fas fa-times me-2"></i>Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
