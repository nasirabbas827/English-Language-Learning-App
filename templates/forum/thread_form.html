{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h3>{{ title }}</h3>
    <div class="card shadow-sm mt-3">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success">Save</button>
                <a href="{% url 'thread_list' %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
