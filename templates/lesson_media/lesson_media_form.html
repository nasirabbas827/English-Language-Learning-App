{% extends 'base.html' %}
{% block title %}{{ title }} - English Language Learning App{% endblock %}
{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col">
            <h2 class="text-primary"><i class="fas fa-photo-video me-2"></i>{{ title }}</h2>
            <hr class="my-4">
        </div>
    </div>
    <div class="row">
        <div class="col">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="row g-3">
                            {% for field in form %}
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">{{ field.label }}</label>
                                {{ field }}
                                {% if field.errors %}
                                <div class="text-danger small">{{ field.errors|striptags }}</div>
                                {% endif %}
                            </div>
                            {% endfor %}
                        </div>
                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-success"><i class="fas fa-save me-2"></i>Save</button>
                            <a href="{% url 'lesson_media_list' %}" class="btn btn-secondary"><i class="fas fa-times me-2"></i>Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
